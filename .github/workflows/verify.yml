name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/xantum-server/backend/package-lock.json
      - run: npm ci --prefix client --ignore-scripts
      - run: npm ci --prefix server/xantum-server/backend --ignore-scripts
      - name: Audit runtime dependencies
        run: |
          npm audit --prefix client --omit=dev --audit-level=moderate
          npm audit --prefix server/xantum-server/backend --omit=dev --audit-level=moderate
      - run: npm run build:ui --prefix client
      - name: Compile Linux helper with fortified libc and warnings as errors
        run: |
          for level in 2 3; do
            gcc -Wall -Wextra -Werror -O2 -D_FORTIFY_SOURCE="$level" -o "/tmp/xtp-tun-helper-$level" server/xantum-server/xtp-tun.c
          done
      - name: Check shell scripts
        run: |
          for script in xantum.sh server/xantum-server/setup.sh server/xantum-server/tls-setup.sh scripts/setup-server.sh scripts/build-client.sh scripts/compile-win-tun.sh client/native/install-linux-helpers.sh client/build/after-install.tpl client/build/after-remove.tpl; do
            bash -n "$script"
          done
      - name: Check Python and polkit sources
        run: |
          python3 -m py_compile client/native/network-protection-linux.py server/xantum-server/acme-webroot.py docs/assets/generate.py
          python3 -c "import xml.etree.ElementTree as E; E.parse('client/native/org.xantum.helpers.policy')"
      - name: Check diff whitespace
        run: git show --format= --check HEAD
  windows-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross-compile Windows helper
        run: x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -o /tmp/xtp-tun-helper.exe client/native/xtp-tun-win.c -lws2_32 -liphlpapi -lole32 -lfwpuclnt -ladvapi32 -static -static-libgcc
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse the Windows deployment launcher without running it
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/server/xantum-server/deploy-to-vps.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
