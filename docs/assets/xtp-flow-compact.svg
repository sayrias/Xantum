<title id="title">XTP bağlantı akışı</title>
<desc id="desc">Windows veya Linux istemcisi TLS ve WSS üzerinden kendi Linux sunucuna bağlanır. Sunucu TUN ve IPv4 NAT üzerinden internete çıkış sağlar. Mimari şemadır; gerçek cihaz testinin yerini tutmaz.</desc>
